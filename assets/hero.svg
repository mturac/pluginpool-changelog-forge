<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="changelog-forge — Conventional commits → CHANGELOG + semver bump.">
      <defs>
        <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
          <stop offset="0%" stop-color="#0d1117"/>
          <stop offset="100%" stop-color="#161b22"/>
        </linearGradient>
        <linearGradient id="accentLine" x1="0" x2="1" y1="0" y2="0">
          <stop offset="0%" stop-color="#a5a5f6" stop-opacity="0"/>
          <stop offset="50%" stop-color="#a5a5f6" stop-opacity="1"/>
          <stop offset="100%" stop-color="#a5a5f6" stop-opacity="0"/>
        </linearGradient>
      </defs>
      <rect width="1200" height="320" fill="url(#bg)"/>
      <rect x="0" y="0" width="1200" height="3" fill="url(#accentLine)"/>
      <text x="60" y="130" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif" font-size="64" font-weight="800" fill="#e6edf3" letter-spacing="-1.5">changelog-forge</text>
      <text x="60" y="175" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" fill="#a5a5f6">/changelog-forge</text>
      <text x="60" y="225" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" fill="#8b949e">Conventional commits → CHANGELOG + semver bump.</text>
      <g transform="translate(820,60)">
    <rect x="0" y="20" width="320" height="180" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="20" y="48" font-family="ui-monospace,monospace" font-size="14" fill="#a5a5f6">## [Unreleased] - 2026-05-16</text>
    <text x="20" y="76" font-family="ui-monospace,monospace" font-size="13" fill="#56d364">### Features</text>
    <text x="20" y="96" font-family="ui-monospace,monospace" font-size="12" fill="#e6edf3">- feat!: drop /v0 endpoints ⚠</text>
    <text x="20" y="120" font-family="ui-monospace,monospace" font-size="13" fill="#79c0ff">### Bug Fixes</text>
    <text x="20" y="140" font-family="ui-monospace,monospace" font-size="12" fill="#e6edf3">- fix(auth): null user in cookie</text>
    <text x="20" y="170" font-family="ui-monospace,monospace" font-size="13" fill="#d29922">bump: major  →  v1.0.0</text>
</g>
      <text x="60" y="290" font-family="ui-monospace,monospace" font-size="13" fill="#6e7681">pluginpool · MIT · Python 3 stdlib only</text>
    </svg>
